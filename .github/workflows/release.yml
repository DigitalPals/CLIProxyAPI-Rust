name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            cargo rustc --release --locked --bin fusebox --target ${{ matrix.target }} -- \
              -C link-arg=-Wl,-z,pack-relative-relocs -C link-arg=-Wl,--icf=all
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Check Linux release
        if: contains(matrix.target, 'linux-gnu')
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/fusebox"
          "$binary" --version
          if [[ "${{ matrix.target }}" == "x86_64-unknown-linux-gnu" ]]; then
            readelf --dynamic "$binary" | grep -E '\(RELR(SZ|ENT)?\)'
            readelf --version-info "$binary" | grep GLIBC_ABI_DT_RELR
          fi
      - name: Package
        shell: bash
        run: |
          name="fusebox-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/fusebox.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/fusebox" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fusebox-*.tar.gz
            fusebox-*.zip
